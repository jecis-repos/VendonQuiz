services:
  app:
    build:
      context: .
      dockerfile: docker/php/php8.1.dockerfile
    working_dir: /var/www
    volumes:
      - ./vendon:/var/www
    environment:
      DB_HOST: database
      DB_DATABASE: ${MYSQL_DATABASE:-vendon}
      DB_USERNAME: ${MYSQL_USER:-vendon}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local-vendon}
    depends_on:
      database:
        condition: service_healthy
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8082}:80"
    volumes:
      - ./vendon:/var/www:ro
      - ./docker/nginx/conf.d/vhost.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vendon}
      MYSQL_USER: ${MYSQL_USER:-vendon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-vendon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql_dump/vendon.sql:/docker-entrypoint-initdb.d/01-vendon.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  dbdata:
